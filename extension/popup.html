<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>filmil's screenshot</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <h1>filmil's screenshot</h1>
  <div id="idle">
    <p class="hint">Take a screenshot of this tab:</p>
    <div class="column">
      <button id="visible" type="button">What is on screen</button>
      <button id="page" type="button">The whole page</button>
    </div>
    <p class="hint">Or record what the tab shows, with its sound:</p>
    <div class="column">
      <button id="record" type="button">Record a video</button>
    </div>
    <p class="hint">It opens in a new tab, where you can select part of a
      screenshot, and save or copy it, or play and save a video.</p>
  </div>
  <div id="recording" hidden>
    <p class="hint" id="elapsed">Recording a video.</p>
    <div class="column">
      <button id="stop" type="button">Stop recording</button>
    </div>
  </div>
  <p id="status" role="status"></p>
  <p id="error" role="alert"></p>
</body>
</html>
